<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 規格預覽</title>
<style>body{margin:0;background:#faf7f0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#2d241c}main{max-width:720px;margin:0 auto;padding:20px 16px 60px}h1{font-size:22px}h2{font-size:13px;letter-spacing:.08em;color:#948f84;margin:28px 0 10px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.demo-modal{background:#faf7f0;border-radius:22px;padding:20px 18px 18px;box-shadow:0 12px 40px rgba(30,25,15,.22);max-width:420px;border:1px solid #deddd5}</style>
<style>/*UI-SPEC:BEGIN*/
/* ═══ UI 規格 v1（2026-11-24，統一介面第 1 批）═══════════════════════════════
   以「新版員工管理」為基準整理的共用規格。⚠ 這一批只新增、不改任何既有畫面：
   所有名稱都以 ui- 開頭（變數 --ui-*），沒有被引用之前不會影響任何頁面。
   後續各頁、各視窗逐批改用這套；規格說明見 docs/ui-spec/UI_SPEC.md，預覽見 docs/ui-spec/preview.html。 */
:root{
  --ui-brand:#245b46;--ui-brand-strong:#1b4636;--ui-brand-soft:#e6eee8;--ui-brand-line:#bcd3c5;
  --ui-warn-bg:#f8edd7;--ui-warn-fg:#7c5722;
  --ui-danger:#b5372e;--ui-danger-soft:#f6e3e0;
  --ui-info-bg:#dbe7f7;--ui-info-fg:#2f5f9e;
  --ui-text:#2d241c;--ui-text-2:#6a655c;--ui-text-3:#948f84;
  --ui-line:#deddd5;--ui-line-strong:#b9b5a8;--ui-surface:#fff;--ui-bg:#faf7f0;--ui-bg-2:#f1eee5;
  --ui-fs-1:11px;--ui-fs-2:12px;--ui-fs-3:13px;--ui-fs-4:14px;--ui-fs-5:16px;--ui-fs-6:18px;--ui-fs-7:22px;
  --ui-r-sm:8px;--ui-r-md:12px;--ui-r-lg:16px;--ui-r-xl:22px;--ui-r-pill:999px;
  --ui-sp-1:4px;--ui-sp-2:8px;--ui-sp-3:12px;--ui-sp-4:16px;--ui-sp-5:24px;
  --ui-h:44px;--ui-h-sm:36px;
  --ui-shadow:0 4px 14px rgba(30,25,15,.12);
}
/* 按鈕：主要／次要／危險／文字連結；固定高度，窄螢幕不縮 */
.ui-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--ui-h);padding:0 var(--ui-sp-4);border:1.5px solid var(--ui-line-strong);border-radius:var(--ui-r-md);background:var(--ui-surface);color:var(--ui-text);font:inherit;font-size:var(--ui-fs-4);font-weight:700;cursor:pointer;white-space:nowrap;box-sizing:border-box;text-decoration:none}
.ui-btn:hover{border-color:var(--ui-brand)}
.ui-btn:disabled,.ui-btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.ui-btn--primary{background:var(--ui-brand);border-color:var(--ui-brand);color:#fff}
.ui-btn--primary:hover{background:var(--ui-brand-strong);border-color:var(--ui-brand-strong)}
.ui-btn--danger{background:var(--ui-danger);border-color:var(--ui-danger);color:#fff}
.ui-btn--danger-soft{background:var(--ui-danger-soft);border-color:transparent;color:var(--ui-danger)}
.ui-btn--warn{background:var(--ui-warn-bg);border-color:transparent;color:var(--ui-warn-fg)}
.ui-btn--link{background:transparent;border-color:transparent;color:var(--ui-brand);min-height:var(--ui-h-sm);padding:0 var(--ui-sp-2)}
.ui-btn--sm{min-height:var(--ui-h-sm);padding:0 var(--ui-sp-3);font-size:var(--ui-fs-3);border-radius:var(--ui-r-sm)}
.ui-btn--block{display:flex;width:100%}
/* 輸入框：同一高度、圓角、聚焦外框；數字欄不要原生上下箭頭 */
.ui-input,.ui-select,.ui-textarea{width:100%;min-width:0;box-sizing:border-box;min-height:var(--ui-h);padding:0 var(--ui-sp-3);border:1px solid var(--ui-line-strong);border-radius:var(--ui-r-md);background:var(--ui-surface);color:var(--ui-text);font:inherit;font-size:var(--ui-fs-4)}
.ui-textarea{padding:var(--ui-sp-3);min-height:88px;line-height:1.6;resize:vertical}
.ui-input:focus,.ui-select:focus,.ui-textarea:focus{outline:none;border-color:var(--ui-brand);box-shadow:0 0 0 3px rgba(36,91,70,.14)}
.ui-input[readonly],.ui-input:disabled,.ui-select:disabled{background:var(--ui-bg-2);color:var(--ui-text-2)}
.ui-input[type=number]{-moz-appearance:textfield;appearance:textfield}
.ui-input[type=number]::-webkit-inner-spin-button,.ui-input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ui-field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--ui-sp-3);min-width:0}
.ui-label{font-size:var(--ui-fs-2);font-weight:700;color:var(--ui-text-2)}
.ui-help{font-size:var(--ui-fs-2);color:var(--ui-text-3);line-height:1.6}
.ui-field-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--ui-sp-3)}
.ui-check{display:flex;align-items:center;gap:var(--ui-sp-2);font-size:var(--ui-fs-4);color:var(--ui-text);cursor:pointer}
.ui-check input{width:18px;height:18px;margin:0;accent-color:var(--ui-brand)}
/* 卡片 */
.ui-card{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--ui-r-lg);padding:var(--ui-sp-4);box-sizing:border-box;min-width:0}
.ui-card+.ui-card{margin-top:var(--ui-sp-3)}
.ui-modal-body>.ui-card+.ui-card{margin-top:0}
.ui-card__title{font-size:var(--ui-fs-2);font-weight:800;letter-spacing:.06em;color:var(--ui-text-3);margin:0 0 var(--ui-sp-3)}
.ui-note{background:var(--ui-bg-2);border-radius:var(--ui-r-md);padding:var(--ui-sp-3);font-size:var(--ui-fs-3);line-height:1.7;color:var(--ui-text-2)}
.ui-note small{display:block;color:var(--ui-text-3)}
.ui-note--warn{background:var(--ui-warn-bg);color:var(--ui-warn-fg)}
/* 頁籤（員工管理那一排）：窄螢幕橫向捲動 */
.ui-tabs{display:flex;gap:5px;background:var(--ui-bg-2);padding:5px;border-radius:var(--ui-r-lg);max-width:100%;overflow-x:auto;scrollbar-width:none}
.ui-tabs::-webkit-scrollbar{display:none}
.ui-tab{border:0;background:transparent;font:inherit;font-size:var(--ui-fs-4);font-weight:700;padding:10px 16px;border-radius:var(--ui-r-md);color:var(--ui-text-2);cursor:pointer;white-space:nowrap}
.ui-tab[aria-selected=true]{background:var(--ui-brand);color:#fff}
@media(max-width:520px){.ui-tab{padding:10px 11px}}
/* 標籤：中性／正常／警示／危險／資訊 */
.ui-badge{display:inline-flex;align-items:center;border-radius:var(--ui-r-pill);padding:3px 10px;font-size:var(--ui-fs-2);font-weight:700;background:var(--ui-brand-soft);color:var(--ui-brand)}
.ui-badge--warn{background:var(--ui-warn-bg);color:var(--ui-warn-fg)}
.ui-badge--danger{background:var(--ui-danger-soft);color:var(--ui-danger)}
.ui-badge--info{background:var(--ui-info-bg);color:var(--ui-info-fg)}
.ui-badge--muted{background:var(--ui-bg-2);color:var(--ui-text-2)}
/* 視窗：放進 showModal() 的內容用這幾個 class。.ui-modal 當標記，會把外層 .modal 改成規格外觀；
   底部按鈕列用 .ui-modal-foot（不是 .modal-foot）——手機版 .modal-foot 有「浮動透明底欄」特殊規則，會讓按鈕看不見。 */
.modal:has(.ui-modal){background:var(--ui-bg);border-radius:var(--ui-r-xl);padding:20px 18px 18px}
.ui-modal{display:none}
.ui-modal-title{font-size:var(--ui-fs-6);font-weight:800;color:var(--ui-text);margin:0 0 var(--ui-sp-3)}
.ui-modal-sub{font-size:var(--ui-fs-3);color:var(--ui-text-2);line-height:1.6;margin:-6px 0 var(--ui-sp-3)}
.ui-modal-body{display:flex;flex-direction:column;gap:var(--ui-sp-3);min-width:0;max-height:min(60vh,560px);overflow-y:auto;overflow-x:hidden;padding:2px}
@media(min-width:721px){.modal:has(.ui-modal--wide){max-width:680px}}
.ui-modal-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:var(--ui-sp-4)}
.ui-modal-foot .ui-btn{flex:1 1 96px}
/* 表格式輸入列（級距、獎金、門檻）：欄頭與資料列共用同一組欄寬；最後一欄放刪除鈕 */
.ui-gridrow{display:grid;gap:var(--ui-sp-2);align-items:center;margin-bottom:var(--ui-sp-2)}
.ui-gridrow>*{min-width:0}
.ui-gridrow--tier{grid-template-columns:1fr 1fr 1.1fr 40px}
.ui-gridrow--bonus{grid-template-columns:1fr 1.2fr 40px}
.ui-gridrow--team{grid-template-columns:1fr 1.1fr 40px}
.ui-gridhead{display:grid;gap:var(--ui-sp-2);font-size:var(--ui-fs-1);font-weight:700;color:var(--ui-text-3);margin:0 0 6px;padding:0 2px}
.ui-btn--icon{padding:0;width:40px;min-height:var(--ui-h-sm)}
.ui-verrow{display:flex;align-items:center;gap:var(--ui-sp-2);flex-wrap:wrap;margin-top:var(--ui-sp-2)}
.ui-card--shared{border:1.5px solid #b48a56}
.ui-sharedhead{display:flex;align-items:center;gap:var(--ui-sp-2);flex-wrap:wrap;margin-bottom:var(--ui-sp-3)}
.ui-empty{padding:var(--ui-sp-5) var(--ui-sp-4);text-align:center;color:var(--ui-text-2);font-size:var(--ui-fs-4)}
</style></head><body><main>
<h1>YUGYM UI 規格 v1</h1>
<h2>按鈕</h2><div class="row"><button class="ui-btn ui-btn--primary">儲存</button><button class="ui-btn">取消</button><button class="ui-btn ui-btn--danger">刪除</button><button class="ui-btn ui-btn--danger-soft">作廢</button><button class="ui-btn ui-btn--link">完整設定 ›</button><button class="ui-btn ui-btn--sm">小按鈕</button><button class="ui-btn" disabled>停用</button></div>
<h2>輸入框</h2><div class="ui-card"><div class="ui-field-row"><div class="ui-field"><label class="ui-label">底薪（月）</label><input class="ui-input" type="number" value="29500"></div><div class="ui-field"><label class="ui-label">計算方式</label><select class="ui-select"><option>累進制</option><option>固定制</option></select></div></div><div class="ui-field"><label class="ui-label">備註</label><textarea class="ui-textarea">範例文字</textarea><span class="ui-help">輔助說明文字</span></div><label class="ui-check"><input type="checkbox" checked>需要上課</label></div>
<h2>卡片與提示</h2><div class="ui-card"><div class="ui-card__title">固定薪資</div><div class="ui-note">一般提示文字，放在卡片裡的說明。</div></div><div class="ui-card"><div class="ui-card__title">缺資料</div><div class="ui-note ui-note--warn">缺歷史依據：2026-07～2026-10 沒有薪資快照。</div></div>
<h2>頁籤</h2><div class="ui-tabs"><button class="ui-tab" aria-selected="false">員工名單</button><button class="ui-tab" aria-selected="false">月度作業</button><button class="ui-tab" aria-selected="true">勞健保</button><button class="ui-tab" aria-selected="false">特休</button><button class="ui-tab" aria-selected="false">權限設定</button></div>
<h2>標籤</h2><div class="row"><span class="ui-badge">正職</span><span class="ui-badge ui-badge--warn">待補</span><span class="ui-badge ui-badge--danger">已停用</span><span class="ui-badge ui-badge--info">兼職</span><span class="ui-badge ui-badge--muted">未設定</span></div>
<h2>視窗（放進 showModal 的內容樣式）</h2><div class="demo-modal"><div class="ui-modal"></div><div class="ui-modal-title">薪資條件 · 範例</div><div class="ui-modal-sub">只調整本月起，過去月份不受影響。</div><div class="ui-modal-body"><div class="ui-card"><div class="ui-card__title">固定薪資</div><div class="ui-field"><label class="ui-label">底薪</label><input class="ui-input" value="29500"></div></div></div><div class="ui-modal-foot"><button class="ui-btn">取消</button><button class="ui-btn ui-btn--primary">儲存</button></div></div>
<h2>表格式輸入列（級距／獎金）</h2><div class="ui-card"><div class="ui-gridhead ui-gridrow--tier"><span>第幾堂起</span><span>到第幾堂</span><span>每堂金額</span><span></span></div><div class="ui-gridrow ui-gridrow--tier"><input class="ui-input" value="1"><input class="ui-input" value="59"><input class="ui-input" value="600"><button class="ui-btn ui-btn--sm ui-btn--icon">✕</button></div><div class="ui-gridrow ui-gridrow--tier"><input class="ui-input" value="60"><input class="ui-input" value="79"><input class="ui-input" value="650"><button class="ui-btn ui-btn--sm ui-btn--icon">✕</button></div><button class="ui-btn ui-btn--sm">＋ 新增級距</button></div><div class="ui-card ui-card--shared" style="margin-top:12px"><div class="ui-sharedhead"><span class="ui-badge ui-badge--warn">全店共用</span><span class="ui-help">以下改的是全店設定，不是只改這一位</span></div></div>
<h2>空狀態</h2><div class="ui-card"><div class="ui-empty">目前沒有資料</div></div>
</main></body></html>
