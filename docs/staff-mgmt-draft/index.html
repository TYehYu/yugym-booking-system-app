<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUGYM 員工管理 草稿（假資料）</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e5e2db;--brand:#b8862b;--ok:#2f7d4f;--warn:#c2410c;--bad:#b91c1c;--blue:#1d4ed8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang TC",sans-serif}
header{background:#1f2328;color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{color:#e8c36a;font-size:16px}.draft{background:#e8c36a;color:#1f2328;border-radius:4px;padding:1px 8px;font-size:12px}
nav{display:flex;gap:4px;margin-left:12px}nav button{background:none;border:0;color:#ccc;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
nav button.on{background:#3a3f47;color:#fff}
.role{margin-left:auto;font-size:12px;display:flex;gap:6px;align-items:center}.role select{padding:3px}
main{max-width:1180px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:0 0 4px;font-size:18px}h3{margin:0 0 8px;font-size:15px}.sub{color:var(--mut);font-size:12.5px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600;background:#faf9f6}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#faf6ea}
a.name{color:var(--blue);font-weight:600;cursor:pointer;text-decoration:none}a.name:hover{text-decoration:underline}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:#fff}
.c-role{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}.c-type{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.c-sys{background:#fef3c7;border-color:#fde68a;color:#92400e}
.c-on{background:#ecfdf5;color:var(--ok)}.c-off{background:#f3f4f6;color:var(--mut)}.c-bad{background:#fee2e2;color:var(--bad);border-color:#fecaca}.c-ok{background:#dcfce7;color:var(--ok)}.c-wait{background:#ffedd5;color:var(--warn);border-color:#fed7aa}
.bang{color:var(--bad);font-weight:700}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}input,select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:12px 0}.tabs button{background:none;border:0;padding:9px 16px;cursor:pointer;font:inherit;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.kv{background:#faf9f6;border:1px solid var(--line);border-radius:8px;padding:10px}.kv small{color:var(--mut);display:block;font-size:12px}.kv b{font-size:16px}
.lock{background:#fff7ed;border:1px dashed #fdba74;color:#9a3412;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:10px}
.denied{padding:30px;text-align:center;color:var(--mut);background:#f3f4f6;border-radius:8px}
.perm{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:6px;vertical-align:middle;background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.steps{display:flex;gap:8px;margin-bottom:12px}.step{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.step.on{border-color:var(--brand);background:#fffaf0}.step b{display:block}
.path{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.path button{border:1px solid #93c5fd;background:#fff;color:var(--blue);border-radius:6px;padding:4px 10px;cursor:pointer}
.calc td:first-child{width:32%}.calc .f{color:var(--mut);font-size:12.5px}.calc tr.tot td{font-weight:700;background:#faf6ea}
.note{font-size:12px;color:var(--mut)}
.vis{width:100%;font-size:12.5px}.vis td,.vis th{text-align:center}.vis td:first-child,.vis th:first-child{text-align:left}
.y{color:var(--ok);font-weight:700}.x{color:var(--bad)}.s{color:var(--warn)}
</style></head><body>
<header><b>YUGYM 員工管理</b><span class="draft">草稿・假資料・未接資料庫</span>
<nav><button id="n1" onclick="go('list')">員工名單</button><button id="n2" onclick="go('month')">月度作業</button><button id="n4" onclick="go('flow')">漏打卡三畫面</button><button id="n3" onclick="go('vis')">權限矩陣</button></nav>
<div class="role">身分預覽：<select id="role" onchange="state.role=this.value;state.sel=null;render()"><option value="hr">人事／薪資人員</option><option value="manager">主管（周大海）</option><option value="desk">櫃檯（吳雅婷）</option><option value="self">員工／教練本人（林小曦）</option><option value="sysadmin">系統管理員（未授予人事）</option></select></div></header>
<main id="app"></main>
<script>
const MONTHS=['2026-11','2026-10'];
// ---- 假資料（姓名、薪資皆為虛構）----
const EMP=[
{id:'E1',name:'林小曦',job:'教練',type:'正職',sys:'一般教練',hire:'2021-03-15',perm:'2021-06-15',status:'在職',base:32000,rate:650,grp:450,trial:300,renew:400,insured:36300,labor:'已加保',health:'已加保',pension:'提繳 6%'},
{id:'E2',name:'周大海',job:'教練',type:'正職',sys:'教練主管（可看全員打卡）',hire:'2019-08-01',perm:'2019-11-01',status:'在職',base:38000,rate:750,grp:500,trial:350,renew:500,insured:42000,labor:'已加保',health:'已加保',pension:'提繳 6%'},
{id:'E3',name:'陳佳蓉',job:'教練',type:'兼職',sys:'一般教練',hire:'2024-02-10',perm:'—',status:'在職',base:0,rate:600,grp:400,trial:250,renew:300,insured:0,labor:'職業工會',health:'依附他人',pension:'—'},
{id:'E4',name:'黃柏宇',job:'教練',type:'合作',sys:'一般教練',hire:'2023-06-20',perm:'—',status:'在職',base:0,rate:900,grp:600,trial:400,renew:0,insured:0,labor:'無',health:'自行投保',pension:'—'},
{id:'E5',name:'吳雅婷',job:'櫃檯',type:'正職',sys:'櫃檯',hire:'2022-09-05',perm:'2022-12-05',status:'在職',base:30000,rate:0,grp:0,trial:0,renew:80,insured:30300,labor:'已加保',health:'已加保',pension:'提繳 6%'},
{id:'E6',name:'鄭宇軒',job:'櫃檯',type:'工讀',sys:'櫃檯',hire:'2026-07-01',perm:'—',status:'在職',base:0,hourly:190,insured:0,labor:'僅職災',health:'—',pension:'—'},
{id:'E7',name:'許文凱',job:'教練',type:'正職',sys:'管理員',hire:'2018-01-02',perm:'2018-04-02',status:'在職',base:45000,rate:850,grp:550,trial:400,renew:600,insured:45800,labor:'已加保',health:'已加保',pension:'提繳 6%'},
{id:'E8',name:'蔡欣怡',job:'教練',type:'兼職',sys:'一般教練',hire:'2023-04-03',perm:'—',status:'離職',resign:'2026-08-31',base:0,rate:600,grp:400,trial:250,renew:300,insured:0,labor:'已退保',health:'已退保',pension:'—'}];
// 本月課務（假）：教練課堂數／團課堂數／體驗／續約數／工時
const WORK={'2026-11':{E1:{c:62,g:14,t:5,r:3,h:176},E2:{c:70,g:20,t:6,r:4,h:184},E3:{c:30,g:6,t:2,r:1,h:92},E4:{c:41,g:8,t:3,r:0,h:104},E5:{c:0,g:0,t:0,r:9,h:168},E6:{h:72},E7:{c:48,g:10,t:4,r:5,h:150}},
'2026-10':{E1:{c:58,g:12,t:4,r:2,h:172},E2:{c:66,g:18,t:5,r:3,h:180},E3:{c:28,g:5,t:1,r:1,h:88},E4:{c:38,g:7,t:3,r:0,h:100},E5:{c:0,g:0,t:0,r:7,h:168},E6:{h:66},E7:{c:44,g:9,t:3,r:4,h:148}}};
// 打卡異常（假）
const ANOM={'2026-11':[
{e:'E1',date:'11/04',type:'漏打下班',detail:'上班 09:02，無下班',req:'已送補打卡申請',st:'待核可'},
{e:'E1',date:'11/12',type:'漏打上班',detail:'下班 18:10，無上班',req:'未申請',st:'未處理'},
{e:'E3',date:'11/09',type:'整天未打',detail:'當天有排班 14:00–20:00',req:'未申請',st:'未處理'},
{e:'E5',date:'11/15',type:'漏打下班',detail:'上班 08:55，無下班',req:'已送補打卡申請',st:'待核可'},
{e:'E6',date:'11/03',type:'遲到 25 分',detail:'排班 13:00，打卡 13:25',req:'—',st:'已確認（不扣）'},
{e:'E2',date:'11/08',type:'漏打上班',detail:'下班 20:05，無上班',req:'已補打卡',st:'已處理'}],'2026-10':[{e:'E5',date:'10/21',type:'漏打下班',detail:'—',req:'已補打卡',st:'已處理'}]};
const state={view:'list',role:'admin',sel:null,tab:0,month:'2026-11',mstep:1,mEmp:null,from:null,af:{emp:'',st:''},q:'',ft:'',fj:''};
const $=s=>document.querySelector(s);const yen=n=>'NT$ '+Math.round(n).toLocaleString();
const E=id=>EMP.find(e=>e.id==id);
function tenure(h,end){const a=new Date(h),b=end?new Date(end):new Date('2026-11-17');let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return Math.floor(m/12)+' 年 '+m%12+' 個月'}
function anomCount(id,m){return (ANOM[m]||[]).filter(a=>a.e==id&&!/已處理|已確認/.test(a.st)).length}
// 權限：薪資、勞健保
state.role='hr';state.perm={view:true,adjust:true,publish:true,hr:true,insure:true,leave:true};state.pc={stage:0};
const MGR=['E1','E3','E4'];
const canSal=()=>state.role=='hr'&&state.perm.view, canIns=()=>state.role=='hr'&&state.perm.insure;
const canList=()=>['hr','manager','desk','sysadmin'].includes(state.role);
const visibleEmp=()=>state.role=='manager'?EMP.filter(e=>MGR.includes(e.id)):state.role=='self'?EMP.filter(e=>e.id=='E1'):EMP;
const ROLE_NAME={hr:'人事／薪資人員',manager:'主管',desk:'櫃檯',self:'員工／教練本人',sysadmin:'系統管理員'};
function go(v){state.view=v;state.sel=null;render()}
function nopage(t){return `<div class="card"><div class="denied">🔒 ${t}<br><span class="note">目前身分：${ROLE_NAME[state.role]}</span></div></div>`}
function render(){['n1','n2','n4','n3'].forEach((id,i)=>$('#'+id).classList.toggle('on',['list','month','flow','vis'][i]==state.view));
 $('#app').innerHTML=state.view=='list'?(state.role=='sysadmin'?nopage('系統管理員預設沒有人事資料權限；需由人事主管另外授予'):state.sel?profile():list()):state.view=='month'?month():state.view=='flow'?flow():vis()}
// ---------- 員工名單 ----------
function list(){const rows=visibleEmp().filter(e=>(!state.q||e.name.includes(state.q))&&(!state.ft||e.type==state.ft)&&(!state.fj||e.job==state.fj));
return `<div class="path"><b>路徑一</b> 查某位員工的到職日與年資：在搜尋欄輸入姓名 → 點姓名 → 「任用與年資」 <button onclick="state.q='林小曦';render();">示範：搜尋「林小曦」</button></div>
<div class="card"><h2>員工名單</h2><div class="sub">只放找人需要的欄位。系統權限在個人檔案「任用與年資」；本月打卡異常在「月度作業」。</div>
<div class="toolbar"><input placeholder="搜尋姓名" value="${state.q}" oninput="state.q=this.value;render();this.focus()" id="q">
<select onchange="state.fj=this.value;render()"><option value="">職務：全部</option><option>教練</option><option>櫃檯</option></select>
<select onchange="state.ft=this.value;render()"><option value="">任用類型：全部</option><option>正職</option><option>兼職</option><option>合作</option><option>工讀</option></select></div>
<table><tr><th>姓名</th><th>職務</th><th>任用類型</th><th>到職日</th><th>年資</th><th>在職狀態</th></tr>
${rows.map(e=>{return `<tr><td><a class="name" onclick="state.sel='${e.id}';state.tab=0;render()">${e.name}</a></td><td><span class="chip c-role">${e.job}</span></td><td><span class="chip c-type">${e.type}</span></td><td>${e.hire}</td><td>${tenure(e.hire,e.resign)}</td><td><span class="chip ${e.status=='在職'?'c-on':'c-off'}">${e.status}</span></td></tr>`}).join('')||'<tr><td colspan=6 class="note">查無資料</td></tr>'}</table></div>`}
// ---------- 個人檔案 ----------
function profile(){const e=E(state.sel);const T=['任用與年資','出勤與休假','薪資','勞健保'];
return `<div class="card"><a class="name" onclick="state.sel=null;render()">← 回員工名單</a>
<h2 style="margin-top:8px">${e.name} <span class="chip c-role">${e.job}</span> <span class="chip c-type">${e.type}</span>  <span class="chip ${e.status=='在職'?'c-on':'c-off'}">${e.status}</span></h2>
<div class="tabs">${T.map((t,i)=>`<button class="${state.tab==i?'on':''}" onclick="state.tab=${i};render()">${t}${i==2&&!canSal()?' 🔒':''}${i==3&&!canIns()?' 🔒':''}</button>`).join('')}</div>${[tab0,tab1,tab2,tab3][state.tab](e)}</div>`}
function tab0(e){const yrs=(new Date('2026-11-17')-new Date(e.hire))/31557600000;const al=yrs<0.5?0:yrs<1?3:yrs<2?7:yrs<3?10:yrs<5?14:yrs<10?15:Math.min(30,15+Math.floor(yrs-9));
return `<div class="grid"><div class="kv"><small>到職日</small><b>${e.hire}</b></div><div class="kv"><small>年資（至今日／離職日）</small><b>${tenure(e.hire,e.resign)}</b></div><div class="kv"><small>轉正日</small><b>${e.perm}</b></div><div class="kv"><small>離職日</small><b>${e.resign||'—'}</b></div></div>
<h3 style="margin-top:16px">任用身分（三件事分開）</h3><table><tr><th>職務</th><td>${e.job}　<span class="note">教練／櫃檯，決定課表與班表</span></td></tr><tr><th>任用類型</th><td>${e.type}　<span class="note">正職／兼職／合作／工讀，決定計薪方式與勞健保規則</span></td></tr><tr><th>系統權限</th><td>${e.sys}　<span class="note">決定能進哪些頁面、看哪些資料（見「資料可見範圍」）</span></td></tr></table>
<h3 style="margin-top:16px">特休</h3><div class="grid"><div class="kv"><small>依年資應有特休</small><b>${e.type=='正職'||e.type=='兼職'?al+' 天':'—'}</b></div><div class="kv"><small>已休</small><b>${e.type=='正職'?Math.min(al,3):0} 天</b></div></div><div class="note" style="margin-top:6px">特休計算沿用現有「特休規則」；此處只是把結果放進個人檔案。</div>`}
function tab1(e){const w=WORK['2026-11'][e.id]||{},a=(ANOM['2026-11']||[]).filter(x=>x.e==e.id);
return `<div class="grid"><div class="kv"><small>本月工時</small><b>${w.h||0} 小時</b></div><div class="kv"><small>本月打卡異常</small><b>${a.length} 筆</b></div><div class="kv"><small>未處理</small><b class="bang">${anomCount(e.id,'2026-11')} 筆</b></div></div>
<h3 style="margin-top:14px">本月異常明細</h3><table><tr><th>日期</th><th>類型</th><th>說明</th><th>補打卡</th><th>處理狀態</th></tr>${a.map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${x.detail}</td><td>${x.req}</td><td><span class="chip ${/已/.test(x.st)?'c-ok':'c-wait'}">${x.st}</span></td></tr>`).join('')||'<tr><td colspan=5 class="note">本月無異常</td></tr>'}</table>
<div class="note" style="margin-top:8px">假勤資料目前來自「出勤」頁與「補打卡申請」，此處改為在個人檔案內一次看到。</div>`}
function tab2(e){if(!canSal())return `<div class="denied">🔒 薪資僅「管理員」可見<br><span class="note">目前身分：${state.role=='coach'?'教練':'櫃檯'}</span></div>`;
const r=[['底薪',e.base?yen(e.base):'無底薪（純抽成／時薪）'],['教練課單價',e.rate?yen(e.rate)+' / 堂':'—'],['團課單價',e.grp?yen(e.grp)+' / 堂':'—'],['體驗課',e.trial?yen(e.trial)+' / 堂':'—'],['續約獎金',e.renew?yen(e.renew)+' / 筆':'—'],['時薪',e.hourly?yen(e.hourly)+' / 小時':'—']];
return `<div class="lock">🔒 此頁含薪資。現況：資料庫僅管理員能讀「薪資範本」；但員工表本身的薪資欄位，櫃檯與教練也讀得到（見「資料可見範圍」）。</div><div class="grid">${r.map(x=>`<div class="kv"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
<div style="margin-top:12px"><button class="btn" onclick="state.view='month';state.mstep=2;state.mEmp='${e.id}';state.from='sum';render()">到本月課酬與薪資核對 →</button></div>`}
function tab3(e){if(!canIns())return `<div class="denied">🔒 勞健保僅「管理員」可見</div>`;
return `<div class="lock">🔒 含投保資料。僅管理員可見。</div><div class="grid"><div class="kv"><small>投保薪資級距</small><b>${e.insured?yen(e.insured):'—'}</b></div><div class="kv"><small>勞保</small><b>${e.labor}</b></div><div class="kv"><small>健保</small><b>${e.health}</b></div><div class="kv"><small>勞退</small><b>${e.pension}</b></div></div><div class="note" style="margin-top:8px">${e.type} 的勞健保規則沿用「勞健保模板」；本頁僅顯示此人適用結果。</div>`}
// ---------- 月度作業 ----------
function pay(e,m){const w=WORK[m][e.id]||{};const L=[];let tot=0;
 if(e.base){L.push(['底薪',e.base,'固定']);tot+=e.base}
 if(e.hourly){const v=e.hourly*w.h;L.push(['時薪薪資',v,`${yen(e.hourly)} × ${w.h} 小時`]);tot+=v}
 if(w.c&&e.rate){const v=w.c*e.rate;L.push(['教練課',v,`${w.c} 堂 × ${yen(e.rate)}`]);tot+=v}
 if(w.g&&e.grp){const v=w.g*e.grp;L.push(['團課',v,`${w.g} 堂 × ${yen(e.grp)}`]);tot+=v}
 if(w.t&&e.trial){const v=w.t*e.trial;L.push(['體驗',v,`${w.t} 堂 × ${yen(e.trial)}`]);tot+=v}
 if(w.r&&e.renew){const v=w.r*e.renew;L.push(['續約',v,`${w.r} 筆 × ${yen(e.renew)}`]);tot+=v}
 const ded=e.insured?Math.round(e.insured*0.115*0.5):0; if(ded){L.push(['勞健保自付額（扣）',-ded,`投保 ${yen(e.insured)} × 試算費率（假）`]);tot-=ded}
 return {L,tot}}
function month(){const m=state.month,cur=EMP.filter(e=>WORK[m][e.id]);const an=ANOM[m]||[];const open=an.filter(a=>!/已處理|已確認/.test(a.st));
const names=[...new Set(open.map(a=>a.e))];

 <h3 style="margin-top:12px">打卡異常（${state.role=='manager'?'所管 3 人':'全部'}）</h3><table><tr><th>員工</th><th>日期</th><th>類型</th><th>狀態</th><th></th></tr>${an.map(a=>`<tr><td>${E(a.e).name}</td><td>${a.date}</td><td>${a.type}</td><td><span class="chip ${/已/.test(a.st)?'c-ok':'c-wait'}">${a.st}</span></td><td>${state.role=='desk'&&!/已處理|已確認/.test(a.st)?'<button class="btn ghost" onclick="state.view=\'flow\';render()">代登補打卡</button>':state.role=='manager'&&/待核可|未處理/.test(a.st)?'<button class="btn ghost" onclick="state.view=\'flow\';render()">核准</button>':''}</td></tr>`).join('')}</table>`;
 if(state.role=='manager'){const mine=EMP.filter(e=>MGR.includes(e.id)&&WORK[m][e.id]);h+=`<h3 style="margin-top:16px">月結工時確認</h3><div class="sub">只顯示工時與授課堂數；薪資、單價預設隱藏。有未處理異常的人不能確認。</div><table><tr><th>員工</th><th class="n">工時</th><th class="n">授課堂數</th><th>未處理異常</th><th>狀態</th></tr>${mine.map(e=>{const w=WORK[m][e.id],n=anomCount(e.id,m);return `<tr><td>${e.name}</td><td class="n">${w.h} h</td><td class="n">${(w.c||0)+(w.g||0)+(w.t||0)}</td><td>${n?'<span class="bang">！'+n+'</span>':'—'}</td><td>${state.hrs[e.id]?'<span class="chip c-ok">已確認</span>':`<button class="btn ghost" ${n?'disabled title="仍有未處理異常"':''} onclick="state.hrs['${e.id}']=1;render()">確認工時</button>`}</td></tr>`}).join('')}</table>`}
 return h+'</div>'};
// ---- 漏打卡三畫面 ----
function flow(){const st=state.pc.stage,w=WORK['2026-11'].E1,p=pay(E('E1'),'2026-11');
const hrsBefore=w.h-8, tl=[['11/12 18:10','系統','發現漏打上班（下班已打）'],st>=1?['11/17 09:20','吳雅婷（櫃檯）','代登補打卡 上班 09:00｜事由：忘記打卡']:null,st>=2?['11/17 10:05','周大海（主管）','核准補打卡']:null,st>=3?['11/17 10:06','周大海（主管）','確認月結工時 '+w.h+' h']:null,st>=4?['11/17 14:30','人事（假）','核對金額無誤']:null].filter(Boolean);
const perm=state.perm;
return `<div class="path"><b>同一筆漏打卡</b>林小曦 2026-11-12 漏打上班。三個角色接力處理；本頁固定以各角色的視角顯示。<button onclick="state.pc.stage=0;state.perm={view:true,adjust:true,publish:true,hr:true,insure:true,leave:true};render()">重設示範</button></div>
<div class="steps">
<div class="step ${st==0?'on':''}"><b>① 櫃檯代登</b><span class="note">${st>=1?'完成：待主管核准':'待處理'}</span></div>
<div class="step ${st==1||st==2?'on':''}"><b>② 主管核准、確認工時</b><span class="note">${st>=3?'完成':st>=1?'待處理':'等待①'}</span></div>
<div class="step ${st>=3?'on':''}"><b>③ 薪資人員核對</b><span class="note">${st>=4?'已核對':st>=3?'待處理':'等待②'}</span></div></div>
<div class="card"><h3>① 櫃檯視角（吳雅婷）</h3><div class="sub">櫃檯看得到工作名單、當班排班與打卡異常；看不到任何金額。</div>
<table><tr><th>員工</th><th>日期</th><th>異常</th><th>狀態</th></tr><tr><td>林小曦</td><td>11/12</td><td>漏打上班（下班 18:10）</td><td><span class="chip ${st==0?'c-bad':'c-wait'}">${st==0?'未處理':'待主管核准'}</span></td></tr></table>
${st==0?`<div class="toolbar" style="margin-top:10px"><label>上班時間 <input value="09:00" style="width:80px"></label><label>事由 <input value="忘記打卡" style="width:200px"></label><button class="btn" onclick="state.pc.stage=1;render()">代登補打卡</button></div><div class="note">送出後狀態為「待主管核准」；櫃檯沒有核准鈕。</div>`:`<div class="lock">已送出，等待主管核准。代登人：吳雅婷。櫃檯不能自行核准。</div>`}</div>
<div class="card"><h3>② 主管視角（周大海，所管：林小曦等 3 人）</h3><div class="sub">只看到工時與授課堂數；薪資、單價、銀行、投保預設隱藏。</div>
${st==0?'<div class="denied">尚無待核准項目</div>':`<table><tr><th>員工</th><th>申請</th><th>代登人</th><th>狀態</th></tr><tr><td>林小曦</td><td>11/12 上班 09:00（忘記打卡）</td><td>吳雅婷</td><td><span class="chip ${st==1?'c-wait':'c-ok'}">${st==1?'待主管核准':'已核准'}</span></td></tr></table>
<table style="margin-top:8px"><tr><th>林小曦 11 月</th><th class="n">工時</th><th class="n">授課堂數</th><th>薪資</th></tr><tr><td>${st>=3?'已確認':'待確認'}</td><td class="n">${st>=2?w.h:hrsBefore} h${st>=2?'':' <span class="note">（核准後 +8）</span>'}</td><td class="n">${w.c+w.g+w.t} 堂</td><td class="note">🔒 預設隱藏</td></tr></table>
<div style="margin-top:10px;display:flex;gap:8px">${st==1?`<button class="btn" onclick="state.pc.stage=2;render()">核准補打卡</button>`:''}${st==2?`<button class="btn" onclick="state.pc.stage=3;render()">確認月結工時（${w.h} h）</button>`:''}${st>=3?'<span class="chip c-ok">工時已確認</span>':''}</div>`}</div>
<div class="card"><h3>③ 人事／薪資人員視角</h3><div class="sub">查看、調整、發布是三種獨立權限（右側可切換，示範分開授權）。</div>
<div class="toolbar">${[['view','薪資查看'],['adjust','薪資調整'],['publish','薪資發布']].map(([k,t])=>`<label style="border:1px solid var(--line);border-radius:6px;padding:4px 8px"><input type="checkbox" ${perm[k]?'checked':''} onchange="state.perm['${k}']=this.checked;render()"> ${t}</label>`).join('')}</div>
${st<3?'<div class="denied">前置條件未完成：需先有「異常已處理」且「主管已確認工時」</div>':!perm.view?'<div class="denied">🔒 沒有「薪資查看」權限，看不到金額</div>':`
<table class="calc"><tr><th>前置檢查</th><th>結果</th></tr><tr><td>打卡異常</td><td><span class="chip c-ok">0 筆未處理</span> <span class="note">11/12 已由吳雅婷代登、周大海核准</span></td></tr><tr><td>月結工時</td><td><span class="chip c-ok">${w.h} h 已由周大海確認</span></td></tr></table>
<table class="calc" style="margin-top:8px"><tr><th>項目</th><th>算式</th><th class="n">金額</th></tr>${p.L.map(x=>`<tr><td>${x[0]}</td><td class="f">${x[2]}</td><td class="n">${yen(x[1])}</td></tr>`).join('')}<tr class="tot"><td>應發合計</td><td></td><td class="n">${yen(p.tot)}</td></tr></table>
<div class="note">課酬金額沿用現有計算（教練課、團課、體驗、續約）；本筆補打卡只影響出勤與工時，不改變這位教練的底薪＋抽成金額。</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" ${st>=4?'disabled':''} onclick="state.pc.stage=4;render()">${st>=4?'已核對無誤':'核對無誤'}</button><button class="btn ghost" ${perm.adjust?'':'disabled title="無「薪資調整」權限"'}>調整金額</button><button class="btn ghost" ${perm.publish&&st>=4?'':'disabled title="需「薪資發布」權限，且先核對無誤"'}>發布給本人</button></div>`}
${st>=3?`<h3 style="margin-top:14px">處理紀錄</h3><table>${tl.map(t=>`<tr><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td></tr>`).join('')}</table>`:''}</div>`}
// ---- 權限矩陣 ----
function vis(){const R=['員工／教練本人','櫃檯','主管','人事／薪資人員','系統管理員'];
const rows=[
['一般資料（姓名、職務、任用類型、狀態）','自己 讀','工作名單 讀','所管 讀','全員 讀寫（任用權）','—'],
['到職日、年資','自己 讀','—','所管 讀','全員 讀寫（任用權）','—'],
['出勤、打卡異常','自己 讀','當班與異常 讀','所管 讀','全員 讀','—'],
['補打卡','提出（自己）','代登 → 待主管核准','核准（所管）','讀','—'],
['休假申請／已核准時段','提出；讀自己','讀已核准時段（排班）','核准；讀所管','讀；特休結算（結算權）','—'],
['特休餘額','自己 讀','—','所管 讀','讀寫（結算權）','—'],
['工時、授課堂數','自己 讀','—','所管 讀；確認月結工時','讀','—'],
['薪資、單價','已發布明細（自己）','—','預設隱藏','查看（查看權）','—'],
['薪資調整','—','—','—','調整（調整權）','—'],
['薪資發布','—','—','—','發布（發布權）','—'],
['銀行、證件','自己 讀；更正用申請','—','預設隱藏','讀寫','—'],
['投保','摘要（自己）','—','預設隱藏','讀寫（投保權）','—'],
['系統權限（角色、帳號）','—','—','—','—','讀寫；人事權限需另外授予']];
const gaps=[
['高','員工表整列對所有教練開放讀取（薪資、單價、身分證、銀行、投保）','需求：教練只看自己','employees_select_all_coach／員工表 87 欄寬表'],
['高','櫃檯、主管被視為同級（is_staff_desk）：可讀全員整列與 salary_history 調薪歷史','需求：櫃檯無薪資；主管只看所管且薪資隱藏','is_staff_desk() 含 is_manager 教練；sh_read'],
['高','本人對自己的補打卡申請有 ALL 權限，可自行改 status 變成「已核准」','需求：本人只能提出','policy pr_self 為 ALL，無欄位限制'],
['中','沒有「所管人員」對應；主管範圍只有旗標，無名單','需求：主管只看所管','未見對應欄位／表（待確認）'],
['中','沒有休假申請表與「已核准休假時段」；特休用量只是員工表欄位','需求：本人提出、主管核准、櫃檯可讀已核准時段','資料表清單：無 leave 申請表'],
['中','補打卡缺「代登人」「核准人」與「待主管核准」狀態','需求：顯示代登人、待主管核准、核准人','punch_requests 欄位只有 status、reviewed_at'],
['中','沒有「已發布薪資明細」與發布狀態；教練薪資頁是即時計算','需求：本人只看已發布','無 payslip／發布紀錄表'],
['中','薪資查看／調整／發布未分權；人事與系統管理合在 role=admin','需求：可分開授權，系統管理員另外取得人事權限','is_admin() 一刀切；員工守衛只認 is_admin'],
['低','沒有「月結工時確認」紀錄','需求：主管確認後才進薪資核對','attendance 未見確認狀態（待確認）']];
return `<div class="card"><h2>權限矩陣（需求版，假資料草稿）</h2><div class="sub">第一版已確認的人事權限。下表是「需求」；現行資料庫差異在下一張表。</div>
<table class="vis"><tr><th>資料／操作</th>${R.map(r=>`<th>${r}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i&&c=='—'?'x':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>
<div class="card"><h2>現行資料庫權限 vs 需求的差異</h2><div class="sub">依正式庫政策／函式定義唯讀核對；未用各角色實際登入實測。</div>
<table><tr><th>等級</th><th>現行</th><th>需求</th><th>依據</th></tr>${gaps.map(g=>`<tr><td><span class="chip ${g[0]=='高'?'c-bad':g[0]=='中'?'c-wait':''}">${g[0]}</span></td><td>${g[1]}</td><td>${g[2]}</td><td class="note">${g[3]}</td></tr>`).join('')}</table></div>`}
render();
</script></body></html>
