# 部署到 GitHub Pages（2026-08-06 改用 Actions）
#
# 原本用 Pages 的內建（legacy）建置：整個 repo 原樣發佈。兩個問題：
#   ① 2026-08-06 晚上開始連續建置失敗（只回「Page build failed」，查不到原因），
#      五個版本卡著上不了線。
#   ② 整個 repo 都公開 —— docs/（含含有會員姓名的 migration 備查檔）、tests/、CLAUDE.md
#      任何人知道網址就讀得到。
#
# 改成自己組 _site：只放實際要跑的檔案，其餘一概不上傳。
# 要新增執行期需要的檔案時，記得加進下面的 COPY 清單。
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # 只改測試／文件／備查 SQL 時不必重新部署（那些檔案本來就不會發佈出去）——
    # 部署一次要好幾分鐘，省下來的都是等待（2026-08-06）
    paths-ignore:
      - 'tests/**'
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # ⚠ 不要用 cancel-in-progress: true（2026-08-06 踩到）——
  # 被取消的那一輪，如果它的檔案已經交給 Pages 的發佈佇列，還是會發佈出去；
  # 今晚佇列很塞，於是舊版本（0118）比新版本（2324）晚落地，把新的蓋掉了。
  # 改成排隊執行：一輪跑完才輪下一輪，最後推的一定最後發佈。
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 佇列卡死保險（2026-08-11）：正常部署 ~20 秒；8/09 與 8/11 各有一輪 pending/queued
    # 卡住數小時到 26 小時，把後面的部署全部堵住（concurrency 是排隊制）。
    # 超過 10 分鐘就視為卡死自動終止，讓佇列前進——這不會有 cancel-in-progress 的
    # 亂序發佈問題（被砍的是「根本沒開始發佈」的懸掛輪）。
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 減肥（2026-09-18）：註解佔 index.html 的 37.6%、佔壓縮後的 52%。
      # 實測 GitHub 到台灣只有約 35 KB/s，整份抓完要 48 秒，剝掉註解之後是 23 秒。
      # 原始碼裡的註解一個都不動，只有發佈出去的那份被剝。
      # ⚠ build/slim.js 會自我驗證（移除的每一段都必須真的是註解、剝完的 JS 不可被後續
      #   處理動到、識別字與字串序列一致…），任何一項不過就結束碼 1 → 整個部署中止。
      #   那是刻意的：寧可線上停在舊版，也不要發一個「解析得過、測試全綠、卻安靜少了
      #   東西」的版本（開發時就踩過一次：樣板字串裡的 <!--ALERTS--> 佔位標記被剝掉）。
      - name: 減肥（剝掉註解，會自我驗證）
        run: |
          set -e
          mkdir -p _site
          node build/slim.js index.html _site/index.html

      - name: 組出要發佈的檔案（只有執行期需要的）
        run: |
          set -e
          mkdir -p _site
          # 雲端設定（index.html 已由上一步產生，不要再覆蓋回未減肥的版本）
          cp config.js _site/
          # PWA 三件組（manifest / service worker / 圖示）
          cp manifest.json sw.js icon-192.png icon-512.png _site/
          # 小管家插圖（index.html 會讀 img/butler/）
          cp -r img _site/
          # 不要 Jekyll 再處理一次
          touch _site/.nojekyll
          echo "--- 將發佈的內容 ---"
          find _site -type f | sort

      - name: 確認沒有把不該公開的東西帶進去
        run: |
          set -e
          for f in docs tests CLAUDE.md README.md build; do
            if [ -e "_site/$f" ]; then echo "❌ _site 裡不該有 $f"; exit 1; fi
          done
          test -f _site/index.html
          test -f _site/config.js
          # 確認發佈的是「減肥過」的那份（防止哪天有人手滑把原始檔 cp 回去蓋掉）
          a=$(wc -c < index.html); b=$(wc -c < _site/index.html)
          echo "  index.html $a → $b bytes"
          if [ "$b" -ge "$a" ]; then echo "❌ _site/index.html 沒有比原始檔小，減肥步驟可能被蓋掉了"; exit 1; fi
          # 版本號必須一致（發佈的版本與原始碼對得上，線上才查得動）
          va=$(grep -o "const APP_VERSION = '[0-9.]*'" index.html | head -1)
          vb=$(grep -o "const APP_VERSION = '[0-9.]*'" _site/index.html | head -1)
          if [ "$va" != "$vb" ] || [ -z "$va" ]; then echo "❌ 版本號對不上：'$va' vs '$vb'"; exit 1; fi
          echo "  版本 $va"
          echo "✓ 內容檢查通過"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages 的發佈佇列在 2026-08-06 晚上很慢（預設 10 分鐘會逾時並「取消」
          # 這次部署，等於白跑）。拉長到 30 分鐘，慢歸慢至少會完成。
          timeout: 1800000
          error_count: 20
